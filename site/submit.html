<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar"><div class="inner"></div></header>
<main class="page" id="page"></main>

<script src="assets/app.js"></script>
<script>
(async function () {
  const T = window.Tracker;
  let data;
  try { data = await T.load(); } catch (e) { return T.fail(e); }
  const page = document.getElementById("page");
  const params = new URLSearchParams(location.search);
  const me = data.viewer;

  page.innerHTML = `
    <div class="page-head">
      <div><h1>Submit work</h1><p class="lede">Submitting as <b>${T.esc(me.name)}</b>. Your work lands in <code>submissions/${T.esc(me.id)}/</code>, stamped with the date it was committed.</p></div>
    </div>
    <div class="grid two">
      <div class="card">
        <div class="field"><label for="s-assignment">Assignment</label>
          <input id="s-assignment" list="assignment-names" value="${T.esc(params.get("assignment") || "")}" placeholder="For example: Literature review, Problem set 3">
          <datalist id="assignment-names">${data.assignmentNames.map((n) => `<option value="${T.esc(n)}"></option>`).join("")}</datalist>
          <span class="help">Type it the way it was given to you. Names already in use appear as suggestions.</span></div>
        <div class="field"><label for="s-title">Title</label><input id="s-title" placeholder="What is this? For example: Literature review, first pass"><span class="help">Short and specific. It becomes the folder name.</span></div>
        <div class="field"><label for="s-notes">One-line note (optional)</label><input id="s-notes" placeholder="Anything the reviewer should know up front"></div>
        <div class="field"><label for="s-body">Description (optional)</label><textarea id="s-body" placeholder="What you did, what is still open, what you want feedback on."></textarea></div>
        <div class="field"><label for="s-files">Files</label><input id="s-files" type="file" multiple><span class="help">Anything: .md, .csv, .xlsx, .pdf, .ipynb, images. Up to 25 MB per file.</span><ul class="filelist" id="s-filelist"></ul></div>
        ${data.uploadUrl ? `<div class="field"><label for="s-passcode">Group passcode</label><input id="s-passcode" type="password" autocomplete="off" placeholder="The passcode the admins gave the group"><span class="help">Keeps strangers from uploading to a public site. Ask Charlie or Prof. Crain if you do not have it.</span></div>` : ""}
        <div class="btn-row">
          <button class="btn primary" id="s-go">${data.uploadUrl ? "Upload" : "Upload on GitHub"}</button>
          <a class="btn" id="s-download" download="submission.md">Download submission.md</a>
          <span class="small muted" id="s-hint"></span>
        </div>
        <div id="s-result" class="section" hidden></div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><h2>What gets created</h2></div>
          <div class="tree" id="s-tree"></div>
          <h3 class="section">submission.md</h3>
          <pre id="s-preview"></pre>
        </div>
        <div class="card">
          ${data.uploadUrl ? `<div class="card-head"><h2>Other ways to submit</h2><span class="small muted">Only if the upload button is not working for you.</span></div>` : ""}
          <div class="tabs"><button class="active" data-tab="web">On GitHub</button><button data-tab="git">Terminal</button><button data-tab="script">Helper script</button></div>
          <div data-panel="web">
            <ol class="steps">
              <li><div><b>Download submission.md</b> using the button on the left. It carries the title, assignment, and notes.</div></li>
              <li><div><b>Click Upload on GitHub.</b> It opens the upload page already pointed at your folder.</div></li>
              <li><div><b>Drop in submission.md and your files</b>, use the commit message shown below, and press <b>Commit changes</b>.</div></li>
            </ol>
            <p class="small ink2" style="margin-top:10px">Commit message: <code id="s-msg"></code></p>
          </div>
          <div data-panel="git" hidden>
            <p class="small ink2">If you work with git locally, from the repo root:</p>
            <pre id="s-git"></pre>
            <div class="btn-row" style="margin-top:8px"><button class="btn small" id="s-copy-git">Copy commands</button></div>
          </div>
          <div data-panel="script" hidden>
            <p class="small ink2">Or let the helper do the folder, submission.md, commit, and push in one go:</p>
            <pre id="s-script"></pre>
            <div class="btn-row" style="margin-top:8px"><button class="btn small" id="s-copy-script">Copy command</button></div>
          </div>
        </div>
      </div>
    </div>`;

  const $ = (id) => document.getElementById(id);
  let files = [];
  $("s-files").addEventListener("change", (e) => { files = Array.from(e.target.files); render(); });
  ["s-assignment", "s-title", "s-notes", "s-body"].forEach((id) => $(id).addEventListener("input", render));
  page.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    page.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    page.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== b.dataset.tab));
  }));

  function build() {
    const assignment = $("s-assignment").value.trim();
    const title = $("s-title").value.trim() || "Untitled";
    const notes = $("s-notes").value.trim();
    const body = $("s-body").value.trim();
    const folder = `${data.today}-${T.slug(title)}`;
    const path = `submissions/${me.id}/${folder}`;
    const md = `---\ntitle: ${title}\nassignment: ${assignment}\n${notes ? `notes: ${notes}\n` : ""}---\n${body ? body + "\n" : ""}`;
    const msg = `${me.name}: ${title} (${assignment})`;
    const q = (s) => `'${s.replace(/'/g, "'\\''")}'`;
    const git = [`mkdir -p ${path}`, `# save submission.md there, then copy your files in`, `git add ${path}`, `git commit -m ${q(msg)}`, `git push`].join("\n");
    const script = `python3 scripts/submit.py --as ${me.id} --assignment ${q(assignment)} --title ${q(title)}${notes ? ` --notes ${q(notes)}` : ""} ${files.length ? files.map((f) => q(f.name)).join(" ") : "<your files>"} --push`;
    return { assignment, title, notes, body, folder, path, md, msg, git, script };
  }

  function render() {
    const b = build();
    $("s-tree").innerHTML = `submissions/<br>&nbsp;&nbsp;${T.esc(me.id)}/<br>&nbsp;&nbsp;&nbsp;&nbsp;<b>${T.esc(b.folder)}/</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>submission.md</b>${files.map((f) => `<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${T.esc(f.name)}`).join("")}${files.length ? "" : '<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="muted">your files</span>'}`;
    $("s-preview").textContent = b.md;
    $("s-msg").textContent = b.msg;
    $("s-git").textContent = b.git;
    $("s-script").textContent = b.script;
    $("s-filelist").innerHTML = files.map((f) => `<li><span class="mono">${T.esc(f.name)}</span><span class="size">${T.fmtSize(f.size)}</span></li>`).join("");
    $("s-download").href = `data:text/markdown;charset=utf-8,${encodeURIComponent(b.md)}`;
    $("s-hint").textContent = data.github ? `Goes to ${data.repo} on branch ${data.branch}` : "No repo configured in members.json";
  }
  render();

  $("s-go").addEventListener("click", async () => {
    const b = build();
    if (!$("s-assignment").value.trim()) { $("s-assignment").focus(); $("s-hint").textContent = "Which assignment is this for?"; return; }
    if (!$("s-title").value.trim()) { $("s-title").focus(); $("s-hint").textContent = "Give it a title first."; return; }
    if (!data.uploadUrl) {
      if (data.github) window.open(`${data.github}/upload/${data.branch}/${b.path}`, "_blank", "noopener");
      return;
    }
    // Upload straight from the site: the worker writes the files into the repo.
    if (!files.length) { $("s-files").focus(); $("s-hint").textContent = "Attach at least one file."; return; }
    const big = files.find((f) => f.size > 25 * 1024 * 1024);
    if (big) { $("s-hint").textContent = `${big.name} is over 25 MB.`; return; }
    if (!$("s-passcode").value) { $("s-passcode").focus(); $("s-hint").textContent = "Enter the group passcode."; return; }
    const form = new FormData();
    form.append("member", me.id);
    form.append("passcode", $("s-passcode").value);
    form.append("assignment", b.assignment);
    form.append("title", b.title);
    form.append("notes", b.notes);
    form.append("body", b.body);
    files.forEach((f) => form.append("files", f, f.name));
    const btn = $("s-go"), result = $("s-result");
    btn.disabled = true; btn.textContent = "Uploading..."; $("s-hint").textContent = "";
    result.hidden = false; result.innerHTML = `<p class="muted">Sending ${files.length} file${files.length === 1 ? "" : "s"} (${T.fmtSize(files.reduce((n, f) => n + f.size, 0))})...</p>`;
    try {
      const res = await fetch(data.uploadUrl, { method: "POST", body: form });
      let out = {};
      try { out = await res.json(); } catch (e) { out = { error: `Unexpected reply (${res.status})` }; }
      if (!res.ok || !out.ok) throw new Error(out.error || `Upload failed (${res.status})`);
      result.innerHTML = `<div class="callout"><b>Uploaded.</b> Your work is in the repo at <code>${T.esc(out.folder)}</code> with ${out.files.length} file${out.files.length === 1 ? "" : "s"}. It shows up on the <a href="${T.withViewer("index.html", data)}">dashboard</a> in about a minute, once the site rebuilds.${out.commit_url ? ` <a class="small" href="${T.esc(out.commit_url)}" target="_blank" rel="noopener">View the commit</a>` : ""}</div>`;
      btn.textContent = "Uploaded";
    } catch (e) {
      result.innerHTML = `<div class="callout warn"><b>Not uploaded.</b> ${T.esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = "Upload";
    }
  });
  $("s-copy-git").addEventListener("click", (e) => T.copyText(build().git, e.target));
  $("s-copy-script").addEventListener("click", (e) => T.copyText(build().script, e.target));
})();
</script>
</body>
</html>
